name: Publish Node.js Package to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Resolve release tag from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          gh api repos/${{ github.repository }}/releases/tags/${TAG_NAME} --jq '.tag_name' > /tmp/release-tag.txt
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "Resolved tag: $(cat /tmp/release-tag.txt)"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build app
        run: npm run build

      - name: Set package version from tag
        run: |
          VERSION="${TAG_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          echo "Package version set to: $(node -p \"require('./package.json').version\")"

      - name: Publish package to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
